<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Care Cubs — immersive interactive experiences for kids">
    <meta name="theme-color" content="#0a0c1a">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Care Cubs | Immersive Experiences">
    <meta property="og:description" content="Explore the Care Cubs interactive experience lab.">
    <title>Care Cubs | Home</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230a0c1a'/><text y='24' font-size='22' fill='%2300d4ff' font-family='sans-serif' font-weight='bold' x='5'>C</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0c1a;
            --text-primary: #ffffff;
            --text-secondary: rgba(190, 200, 230, 0.55);
            --brand-blue: #00d4ff;
            --brand-pink: #ff006e;
            --brand-purple: #b040ff;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background: radial-gradient(ellipse at 50% 35%, #181c3a 0%, #0d0f20 40%, #070910 100%);
            font-family: 'Montserrat', sans-serif;
            color: var(--text-primary);
        }

        /* ─── LOADER ──────────────────────────────────────── */
        #loader {
            position: fixed; inset: 0; z-index: 100;
            background: radial-gradient(ellipse at 50% 35%, #181c3a 0%, #0d0f20 40%, #070910 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px;
            transition: opacity 0.8s var(--ease-out-expo), filter 0.8s ease;
        }
        #loader.hidden { opacity: 0; pointer-events: none; filter: blur(15px); }

        .loader-ring {
            position: relative; width: 90px; height: 90px;
            display: flex; align-items: center; justify-content: center;
        }
        .loader-ring svg {
            position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg);
        }
        .loader-ring circle {
            fill: none; stroke-width: 2.5; stroke-linecap: round;
        }
        .ring-bg { stroke: rgba(255,255,255,0.04); }
        .ring-fg {
            stroke: url(#ring-grad); stroke-dasharray: 283; stroke-dashoffset: 283;
            animation: trace 1.6s cubic-bezier(0.65, 0, 0.35, 1) forwards; transform-origin: center;
        }
        .loader-logo {
            font-size: 2.4rem; font-weight: 700; color: #fff;
            letter-spacing: -0.05em; opacity: 0; transform: scale(0.85);
            animation: pop-in 0.9s var(--ease-out-back) 0.4s forwards;
            text-shadow: 0 0 25px rgba(0, 212, 255, 0.4);
        }
        .loader-text {
            font-size: 0.75rem; font-weight: 600; letter-spacing: 0.5em; color: var(--text-secondary);
            text-transform: uppercase; opacity: 0; animation: fade-up 0.8s var(--ease-out-expo) 0.6s forwards;
        }
        @keyframes trace { to { stroke-dashoffset: 0; transform: rotate(180deg); } }
        @keyframes pop-in { to { opacity: 1; transform: scale(1); } }
        @keyframes fade-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        /* ─── FLASH ───────────────────────────────────────── */
        #flash { position:fixed;inset:0;pointer-events:none;opacity:0;z-index:50;
            background:radial-gradient(ellipse at center, rgba(0,212,255,.3) 0%, rgba(176,64,255,.1) 50%, transparent 70%);
        }

        /* ─── CANVAS + GLOW ───────────────────────────────── */
        #canvas-container { position:absolute;top:0;left:0;width:100%;height:100%;z-index:1; }

        .ambient-glow { position:absolute;top:50%;left:50%;width:1px;height:1px;z-index:1;pointer-events:none; }
        .glow-ring { position:absolute;top:50%;left:50%;border-radius:50%;will-change:transform,opacity; }
        .glow-ring:nth-child(1) {
            width:540px;height:540px;transform:translate(-50%,-50%);
            background:radial-gradient(circle,rgba(0,212,255,.1) 0%,transparent 68%);
            animation:breathe 6s ease-in-out infinite;
        }
        .glow-ring:nth-child(2) {
            width:860px;height:860px;transform:translate(-50%,-50%);
            background:radial-gradient(circle,rgba(176,64,255,.07) 0%,transparent 68%);
            animation:breathe 8s ease-in-out infinite; animation-delay:-3s;
        }
        .glow-ring:nth-child(3) {
            width:1200px;height:1200px;transform:translate(-50%,-50%);
            background:radial-gradient(circle,rgba(0,212,255,.04) 0%,transparent 68%);
            animation:breathe 11s ease-in-out infinite; animation-delay:-6s;
        }
        @keyframes breathe {
            0%,100%{transform:translate(-50%,-50%) scale(1);opacity:1}
            50%{transform:translate(-50%,-50%) scale(1.1);opacity:.45}
        }

        /* ─── CONTENT ─────────────────────────────────────── */
        #content {
            position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;
            display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;
        }

        @keyframes slideUp { from{opacity:0;transform:translateY(32px)} to{opacity:1;transform:translateY(0)} }

        .main-container {
            position:relative;text-align:center;pointer-events:auto;
            background:rgba(255,255,255,.025);
            backdrop-filter:blur(48px) saturate(180%);
            -webkit-backdrop-filter:blur(48px) saturate(180%);
            padding:80px 100px;border-radius:32px;
            border:1px solid rgba(255,255,255,.08);
            box-shadow:0 30px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);
            opacity:0;
            transition:border-color .4s ease,box-shadow .5s ease,transform .4s var(--ease-out-expo);
        }
        .main-container::before {
            content:'';position:absolute;inset:0;border-radius:32px;padding:1px;pointer-events:none;
            background:linear-gradient(135deg,rgba(0,212,255,.4),rgba(176,64,255,.15) 50%,rgba(255,0,110,.28) 100%);
            -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
            -webkit-mask-composite:destination-out;
            mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
            mask-composite:exclude;
            opacity:0;transition:opacity .45s ease;
        }
        .main-container:hover::before { opacity:1; }
        .main-container:hover {
            transform:translateY(-6px);
            border-color:rgba(0,212,255,.28);
            box-shadow:0 40px 80px rgba(0,0,0,.75),0 0 60px rgba(0,212,255,.1),inset 0 1px 0 rgba(255,255,255,.14);
        }

        .main-container.animate-in { animation:slideUp 1s var(--ease-out-expo) both; }
        .main-container.animate-in .subtitle { animation:slideUp .7s var(--ease-out-expo) .3s both; }
        .main-container.animate-in h1 { animation:slideUp .7s var(--ease-out-expo) .5s both; }
        .main-container.animate-in .play-btn { animation:slideUp .7s var(--ease-out-back) .7s both; }

        .subtitle {
            font-size:.82rem;font-weight:600;letter-spacing:.45em;text-transform:uppercase;
            color:var(--text-secondary);margin-bottom:20px;display:block;
        }
        h1 { margin:0 0 50px;font-size:clamp(3rem,6vw,4.5rem);font-weight:300;letter-spacing:-.02em;line-height:1.1; }
        h1 b { font-weight:700; }

        /* ─── BUTTON ──────────────────────────────────────── */
        .play-btn {
            display:inline-flex;align-items:center;justify-content:center;position:relative;
            padding:17px 48px;font-size:.95rem;font-weight:600;letter-spacing:.08em;
            text-decoration:none;border-radius:100px;color:var(--text-primary);
            background:transparent;border:1px solid transparent;background-clip:padding-box;overflow:hidden;
            box-shadow:0 0 0 1px rgba(0,212,255,.5),0 10px 30px rgba(0,212,255,.12),inset 0 1px 0 rgba(255,255,255,.06);
            transition:box-shadow .35s ease,transform .3s var(--ease-out-back);pointer-events:auto;
        }
        .play-btn::before {
            content:'';position:absolute;top:0;left:-75%;width:50%;height:100%;pointer-events:none;
            background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
            transform:skewX(-20deg);transition:left .55s ease;
        }
        .play-btn::after {
            content:'';position:absolute;inset:0;border-radius:100px;pointer-events:none;
            background:linear-gradient(135deg,rgba(0,212,255,.14),rgba(176,64,255,.08),rgba(255,0,110,.1));
            opacity:0;transition:opacity .35s ease;
        }
        .play-btn:hover { transform:translateY(-3px); box-shadow:0 0 0 1px rgba(0,212,255,.95),0 0 0 3px rgba(0,212,255,.14),0 16px 40px rgba(0,212,255,.26),inset 0 1px 0 rgba(255,255,255,.1); }
        .play-btn:hover::before { left:125%; }
        .play-btn:hover::after  { opacity:1; }
        .play-btn:active { transform:translateY(-1px) scale(.97); }
        .play-btn:focus-visible { outline:2px solid var(--brand-blue); outline-offset:5px; }

        /* ─── REDUCED MOTION ──────────────────────────────── */
        @media (prefers-reduced-motion:reduce) {
            .main-container { opacity:1 !important; }
            .main-container.animate-in,.main-container.animate-in .subtitle,
            .main-container.animate-in h1,.main-container.animate-in .play-btn
            { animation:none !important;opacity:1 !important;transform:none !important; }
            .glow-ring { animation:none !important; }
            .play-btn::before { transition:none !important; }
            .main-container { transition:none !important; }
        }
    </style>
</head>
<body>

<div id="loader" role="status" aria-label="Loading Care Cubs">
    <div class="loader-ring">
        <svg viewBox="0 0 100 100">
            <defs>
                <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#00d4ff" />
                    <stop offset="100%" stop-color="#b040ff" />
                </linearGradient>
            </defs>
            <circle class="ring-bg" cx="50" cy="50" r="45"></circle>
            <circle class="ring-fg" cx="50" cy="50" r="45"></circle>
        </svg>
        <div class="loader-logo" aria-hidden="true">C</div>
    </div>
    <div class="loader-text" aria-hidden="true">INITIALIZING</div>
</div>

<div id="flash" aria-hidden="true"></div>
<div id="canvas-container"></div>
<div class="ambient-glow" aria-hidden="true">
    <div class="glow-ring"></div>
    <div class="glow-ring"></div>
    <div class="glow-ring"></div>
</div>

<div id="content">
    <div class="main-container">
        <span class="subtitle">Care Cubs Platform</span>
        <h1>Immersive<br><b>Experiences</b></h1>
        <a href="games_list.html" class="play-btn" aria-label="Explore the Care Cubs experience lab">Explore Lab</a>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Care Cubs — cinematic convergence intro + InstancedMesh

const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ── AUDIO ────────────────────────────────────────────────────
let audioCtx = null, masterGain = null;

function initAudio() {
    if (audioCtx) return;
    try {
        audioCtx  = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.5;
        masterGain.connect(audioCtx.destination);
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    } catch(e) {}
}

function playWhoosh() {
    if (!audioCtx || audioCtx.state !== 'running') return;
    try {
        const dur = 2.3;
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
        const d   = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const src    = audioCtx.createBufferSource();
        src.buffer   = buf;
        const filt   = audioCtx.createBiquadFilter();
        filt.type    = 'bandpass';
        filt.frequency.setValueAtTime(250, audioCtx.currentTime);
        filt.frequency.linearRampToValueAtTime(4000, audioCtx.currentTime + dur * .75);
        filt.Q.value = 0.8;
        const gain   = audioCtx.createGain();
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(.32, audioCtx.currentTime + .35);
        gain.gain.linearRampToValueAtTime(0,   audioCtx.currentTime + dur);
        src.connect(filt); filt.connect(gain); gain.connect(masterGain);
        src.start();
    } catch(e) {}
}

function playImpact() {
    if (!audioCtx || audioCtx.state !== 'running') return;
    try {
        const now = audioCtx.currentTime;
        // Sub thud
        const o1 = audioCtx.createOscillator(), g1 = audioCtx.createGain();
        o1.type = 'sine';
        o1.frequency.setValueAtTime(110, now);
        o1.frequency.exponentialRampToValueAtTime(28, now + .5);
        g1.gain.setValueAtTime(.8, now);
        g1.gain.exponentialRampToValueAtTime(.001, now + .7);
        o1.connect(g1); g1.connect(masterGain); o1.start(); o1.stop(now + .7);
        // High sparkle
        const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
        o2.type = 'triangle';
        o2.frequency.setValueAtTime(1600, now);
        o2.frequency.exponentialRampToValueAtTime(300, now + .35);
        g2.gain.setValueAtTime(.22, now);
        g2.gain.exponentialRampToValueAtTime(.001, now + .4);
        o2.connect(g2); g2.connect(masterGain); o2.start(); o2.stop(now + .4);
    } catch(e) {}
}

function playReveal() {
    if (!audioCtx || audioCtx.state !== 'running') return;
    try {
        const now = audioCtx.currentTime;
        [261.63, 329.63, 392.00, 523.25].forEach((freq, i) => {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = 'sine'; o.frequency.value = freq;
            const t = now + i * .09;
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(.13, t + .18);
            g.gain.linearRampToValueAtTime(0,   t + 2.2);
            o.connect(g); g.connect(masterGain);
            o.start(t); o.stop(t + 2.4);
        });
    } catch(e) {}
}

['mousemove','mousedown','touchstart'].forEach(evt =>
    document.addEventListener(evt, initAudio, { once: true, passive: true }));

// ── SCENE ────────────────────────────────────────────────────
const scene    = new THREE.Scene();
scene.fog      = new THREE.FogExp2(0x0a0d1e, 0.0075);

const camera   = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 42;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.getElementById('canvas-container').appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const L1 = new THREE.DirectionalLight(0x00d4ff, 4.5); L1.position.set(-10, 8, 15); scene.add(L1);
const L2 = new THREE.DirectionalLight(0xff006e, 3.0); L2.position.set(12, -8, 10); scene.add(L2);
const L3 = new THREE.DirectionalLight(0xb040ff, 2.0); L3.position.set(0, 6, -18);  scene.add(L3);
const centerLight = new THREE.PointLight(0x00d4ff, 0, 60); scene.add(centerLight);

// ── MATERIALS ────────────────────────────────────────────────
const matA = new THREE.MeshStandardMaterial({ color:0x00d4ff, emissive:0x005577, emissiveIntensity:1.1, metalness:.5, roughness:.12, transparent:true, opacity:.82 });
const matB = new THREE.MeshStandardMaterial({ color:0xff006e, emissive:0x550011, emissiveIntensity:1.1, metalness:.5, roughness:.12, transparent:true, opacity:.72 });
const matC = new THREE.MeshStandardMaterial({ color:0xb040ff, emissive:0x330055, emissiveIntensity:1.1, metalness:.5, roughness:.12, transparent:true, opacity:.72 });

// ── GEOMETRY + INSTANCED MESHES ──────────────────────────────
const BS       = 2.5;
const cubeGeo  = new THREE.BoxGeometry(BS * .88, BS * .88, BS * .88);
const PC       = 60;   // total pieces
const PPC      = 20;   // pieces per color
const INST     = PPC * 4; // 80 instances per mesh

const meshA = new THREE.InstancedMesh(cubeGeo, matA, INST);
const meshB = new THREE.InstancedMesh(cubeGeo, matB, INST);
const meshC = new THREE.InstancedMesh(cubeGeo, matC, INST);
[meshA, meshB, meshC].forEach(m => { m.frustumCulled = false; scene.add(m); });

const shapesMap = [
    [{x:0,y:1.5},{x:0,y:.5},{x:0,y:-.5},{x:0,y:-1.5}],
    [{x:-.5,y:.5},{x:.5,y:.5},{x:-.5,y:-.5},{x:.5,y:-.5}],
    [{x:0,y:.5},{x:-1,y:-.5},{x:0,y:-.5},{x:1,y:-.5}],
    [{x:-.5,y:1},{x:-.5,y:0},{x:-.5,y:-1},{x:.5,y:-1}],
    [{x:0,y:.5},{x:1,y:.5},{x:-1,y:-.5},{x:0,y:-.5}],
];

// ── PIECE DATA ────────────────────────────────────────────────
const pieces = [];
for (let i = 0; i < PC; i++) {
    // Start: fly in from left (even) or right (odd)
    const fromLeft = i % 2 === 0;
    const spx = fromLeft ? -120 - Math.random() * 40 : 120 + Math.random() * 40;
    const spy = (Math.random() - .5) * 80;
    const spz = (Math.random() - .5) * 40;

    // Converge: spread on a sphere surface
    const theta = (i / PC) * Math.PI * 2;
    const phi   = Math.acos(2 * (i / PC) - 1);
    const r     = 5 + Math.random() * 7;
    const cpx   = r * Math.sin(phi) * Math.cos(theta);
    const cpy   = r * Math.sin(phi) * Math.sin(theta) * .5;
    const cpz   = r * Math.cos(phi) * .65;

    // Idle: random floating positions
    const ipx = (Math.random() - .5) * 100;
    const ipy = (Math.random() - .5) * 100;
    const ipz = (Math.random() - .5) * 55 - 12;

    pieces.push({
        shape:  shapesMap[i % shapesMap.length],
        px: spx, py: spy, pz: spz,
        rx: Math.random() * Math.PI, ry: Math.random() * Math.PI, rz: 0,
        rotX: (Math.random() - .5) * .013,
        rotY: (Math.random() - .5) * .013,
        rotZ: (Math.random() - .5) * .006,
        speedY: Math.random() * .04 + .012,
        speedX: (Math.random() - .5) * .011,
        spx, spy, spz, cpx, cpy, cpz, ipx, ipy, ipz,
        colorIdx: i % 3,
    });
}

const dummy = new THREE.Object3D();

function updateInstanceMatrices() {
    let ia = 0, ib = 0, ic = 0;
    for (let i = 0; i < pieces.length; i++) {
        const p    = pieces[i];
        const mesh = p.colorIdx === 0 ? meshA : p.colorIdx === 1 ? meshB : meshC;
        for (let b = 0; b < p.shape.length; b++) {
            const c = p.shape[b];
            dummy.position.set(p.px + c.x * BS, p.py + c.y * BS, p.pz);
            dummy.rotation.set(p.rx, p.ry, p.rz);
            dummy.updateMatrix();
            const idx = p.colorIdx === 0 ? ia++ : p.colorIdx === 1 ? ib++ : ic++;
            mesh.setMatrixAt(idx, dummy.matrix);
        }
    }
    meshA.instanceMatrix.needsUpdate = true;
    meshB.instanceMatrix.needsUpdate = true;
    meshC.instanceMatrix.needsUpdate = true;
}

function updateIdle(delta) {
    const dt = delta * 60;
    for (let i = 0; i < pieces.length; i++) {
        const p = pieces[i];
        if (!reducedMotion) { p.rx += p.rotX * dt; p.ry += p.rotY * dt; p.rz += p.rotZ * dt; }
        p.py -= p.speedY * dt;
        p.px += p.speedX * dt;
        if (p.py < -60) { p.py = 60; p.px = (Math.random() - .5) * 120; }
    }
}

// ── INTRO STATE MACHINE ──────────────────────────────────────
const FLYIN   = 2.1;
const HOLD    = 0.45;
const SCATTER = 0.9;
const TOTAL   = FLYIN + HOLD + SCATTER;

let introTime    = 0;
let introRunning = false;
let impactDone   = false;
let uiDone       = false;

function easeOutQuart(t) { return 1 - Math.pow(1 - Math.min(t,1), 4); }
function easeInOut(t)    { t = Math.min(t,1); return t < .5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
function easeOutCubic(t) { return 1 - Math.pow(1 - Math.min(t,1), 3); }

function runIntro(delta) {
    introTime += delta;

    if (introTime < FLYIN) {
        const t = easeOutQuart(introTime / FLYIN);
        for (let i = 0; i < pieces.length; i++) {
            const p = pieces[i];
            p.px = p.spx + (p.cpx - p.spx) * t;
            p.py = p.spy + (p.cpy - p.spy) * t;
            p.pz = p.spz + (p.cpz - p.spz) * t;
            const spin = (1 + (1 - t) * 2) * delta * 60;
            p.rx += p.rotX * spin; p.ry += p.rotY * spin;
        }
        centerLight.intensity = t * 2.5;

    } else if (introTime < FLYIN + HOLD) {
        for (let i = 0; i < pieces.length; i++) {
            const p = pieces[i];
            p.px = p.cpx; p.py = p.cpy; p.pz = p.cpz;
            p.rx += p.rotX * delta * 60 * .25; p.ry += p.rotY * delta * 60 * .25;
        }
        if (!impactDone) {
            impactDone = true;
            playImpact();
            const flash = document.getElementById('flash');
            flash.style.transition = 'none';
            flash.style.opacity    = '1';
            setTimeout(() => { flash.style.transition = 'opacity .7s ease'; flash.style.opacity = '0'; }, 60);
        }
        centerLight.intensity = 4.0 * (1 - (introTime - FLYIN) / HOLD);

    } else {
        const st = easeOutCubic((introTime - FLYIN - HOLD) / SCATTER);
        for (let i = 0; i < pieces.length; i++) {
            const p = pieces[i];
            p.px = p.cpx + (p.ipx - p.cpx) * st;
            p.py = p.cpy + (p.ipy - p.cpy) * st;
            p.pz = p.cpz + (p.ipz - p.cpz) * st;
            const spin = (1 + (1 - st) * 3) * delta * 60;
            p.rx += p.rotX * spin; p.ry += p.rotY * spin;
        }
        centerLight.intensity = 0;
        if (!uiDone && st > .28) {
            uiDone = true;
            playReveal();
            document.querySelector('.main-container').classList.add('animate-in');
        }
    }
}

// ── CAMERA ───────────────────────────────────────────────────
let targetX = 0, targetY = 0;
document.addEventListener('mousemove', e => {
    targetX =  (e.clientX - window.innerWidth  / 2) * .018;
    targetY =  (e.clientY - window.innerHeight / 2) * .018;
});

// ── ANIMATE LOOP ─────────────────────────────────────────────
const clock = new THREE.Clock();
let frameIdx = 0, lowPerf = false, lastFPS = performance.now(), fCount = 0;

function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), .05);
    frameIdx++; fCount++;

    const now = performance.now();
    if (now - lastFPS >= 2000) {
        lowPerf = fCount / ((now - lastFPS) / 1000) < 28;
        lastFPS = now; fCount = 0;
    }

    const lf = 1 - Math.pow(.022, delta);
    camera.position.x += (targetX  - camera.position.x) * lf;
    camera.position.y += (-targetY - camera.position.y) * lf;
    camera.lookAt(scene.position);

    if (introRunning && introTime < TOTAL) {
        runIntro(delta);
    } else if (introTime >= TOTAL) {
        if (!lowPerf || frameIdx % 2 === 0) updateIdle(delta);
    }

    if (!lowPerf || frameIdx % 2 === 0) updateInstanceMatrices();
    renderer.render(scene, camera);
}

animate();

// ── LOADER DISMISS ────────────────────────────────────────────
requestAnimationFrame(() => requestAnimationFrame(() => {
    document.getElementById('loader').classList.add('hidden');
    setTimeout(() => {
        initAudio();
        if (reducedMotion) {
            for (const p of pieces) { p.px = p.ipx; p.py = p.ipy; p.pz = p.ipz; }
            introTime = TOTAL;
            document.querySelector('.main-container').classList.add('animate-in');
        } else {
            introRunning = true;
            playWhoosh();
        }
    }, 650);
}));

// ── RESIZE ───────────────────────────────────────────────────
let resizeT = null;
window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    }, 150);
});
</script>
